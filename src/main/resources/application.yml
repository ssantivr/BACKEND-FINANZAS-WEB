server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: finanzas-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/finanzas}
      # Explicit name, so an Atlas URI copied without "/finanzas" still works (it takes precedence over the URI).
      database: ${MONGODB_DATABASE:finanzas}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secreto: ${JWT_SECRET}
  cors:
    origenes: ${CORS_ORIGINS:http://localhost:5173}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cookie:
    segura: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAMESITE:None}
  correo:
    remitente: ${MAIL_FROM:no-responder@finanzas.local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
